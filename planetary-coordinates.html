<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLANETARY LOCATOR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div id="stars"></div>

<header>
  <div class="logo-icon">⊕</div>
  <div>
    <h1>PLANETARY LOCATOR</h1>
    <div class="subtitle">MULTI-WORLD COORDINATE POSITIONING SYSTEM</div>
  </div>
</header>

<div class="input-panel">
  <div class="panel-label">▸ Entrez vos coordonnées</div>
  <div class="input-row">
    <div class="coord-group">
      <label>LATITUDE (°N/S)</label>
      <input type="number" id="lat" placeholder="48.8566" min="-90" max="90" step="0.0001" value="48.8566">
    </div>
    <div class="coord-group">
      <label>LONGITUDE (°E/O)</label>
      <input type="number" id="lng" placeholder="2.3522" min="-180" max="180" step="0.0001" value="2.3522">
    </div>
    <button class="btn btn-geo" onclick="useGeolocation()">⊕ Ma position GPS</button>
    <button class="btn btn-primary" onclick="updateAllMaps()">▸ LOCALISER</button>
  </div>
  <div class="status-bar" id="status">⬡ Système prêt — Cliquez sur ⊞ dans chaque carte pour changer de couche</div>
</div>

<div class="divider"></div>
<div class="section-title">Cartes planétaires <span id="planet-count"></span> mondes</div>
<div class="planets-grid" id="grid"></div>
<link rel ="stylesheet" href="./style.css" />
<script src="./main.js"></script>
</body>
</html>
